<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the gradient run under the notch and the home
     indicator; the CSS then pads content back with the safe-area insets. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MadeForU Sales</title>
<meta name="description" content="Orders, bills and partner accounts for MadeForU.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F54A77">
<link rel="icon" href="icons/favicon.png" sizes="64x64" type="image/png">

<!-- iOS ignores most of the manifest. These are what make "Add to Home
     Screen" produce a real app window rather than a Safari tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MadeForU">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- The ?v= is the whole update mechanism: a new build is a new URL,
     and no cache can answer a URL it has never seen. Bump it, BUILD in
     app.js and CACHE in sw.js together — check-versions.sh asserts it. -->
<link rel="stylesheet" href="app.css?v=2026-09-19.1">
</head>
<body>

<div id="app" aria-live="polite"></div>

<!-- The bottom bar is outside #app so switching screens never re-creates
     it; it is hidden until someone signs in. -->
<nav id="tabbar" class="tabbar" hidden></nav>

<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js?v=2026-09-19.1"></script>
</body>
</html>
