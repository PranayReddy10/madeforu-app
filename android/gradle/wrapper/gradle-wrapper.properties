# Pinned deliberately. Without this file the build uses whatever Gradle
# happens to be installed — which is how a 9.0-milestone build ended up
# printing deprecation warnings that come from Android Gradle Plugin
# 8.7.3, not from anything in this project.
#
# 8.11.1 is a stable release inside AGP 8.7.3's supported range (AGP 8.7
# requires Gradle 8.9 or newer). Bump both together, never one alone.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# Checksum of the official distribution: the wrapper refuses to run if the
# download does not match, so a proxy or a mirror cannot substitute it.
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
