# ── Memory ─────────────────────────────────────────────────────────
# The Gradle daemon and the KOTLIN daemon are two separate JVMs. Only
# setting the first one leaves the Kotlin compiler on a small default
# heap, and when it runs out it exits cleanly on startup — which is
# reported as the confusing:
#
#   The daemon has terminated unexpectedly on startup attempt #1
#   with error code: 0
#
# Giving each its own heap is the fix. Lower these if the machine has
# 8 GB or less; raise them if a build is slow on a big machine.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# If the Kotlin daemon still refuses to start — some Windows setups with
# antivirus or a restrictive firewall block the local socket it uses —
# uncomment this. It compiles inside the Gradle daemon instead: slower on
# repeat builds, but it removes the second process entirely.
# kotlin.compiler.execution.strategy=in-process

# ── Build behaviour ────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
