# ── Kotlin compilation strategy ────────────────────────────────────
# Compile inside the Gradle daemon rather than in a separate Kotlin
# daemon process.
#
# By default the Kotlin plugin forks a second JVM and talks to it over a
# local socket. When anything blocks that socket — Windows Defender and
# corporate antivirus are the usual culprits, but a VPN or a firewall rule
# does it too — the daemon starts, prints "Kotlin compile daemon is
# ready", and is then dropped because the build cannot attach to it. The
# Kotlin plugin reports that as:
#
#   The daemon has terminated unexpectedly on startup attempt #1
#   with error code: 0
#
# Note the 0: it exited cleanly. Nothing crashed and nothing ran out of
# memory — the handshake failed. No amount of extra heap changes it.
#
# in-process removes the second JVM entirely, so there is no socket and
# nothing to block. The cost is that compilation cannot be kept warm
# between builds, which for 29 Kotlin files is a second or two. Worth it
# for a build that simply works on every partner's machine.
#
# To go back to the daemon (slightly faster incremental builds), comment
# this line out and uncomment kotlin.daemon.jvmargs below.
kotlin.compiler.execution.strategy=in-process

# ── Memory ─────────────────────────────────────────────────────────
# Compilation now happens inside the Gradle daemon, so this heap covers
# both. On a machine with 8 GB or less, drop to -Xmx2048m.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Only used when the strategy above is commented out. No metaspace cap
# on purpose: the Kotlin compiler loads a lot of classes and a tight cap
# is its own source of failures.
# kotlin.daemon.jvmargs=-Xmx2048m

# ── Build behaviour ────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
